services:
    php:
        build:
            context: .
            dockerfile: runtime/Dockerfile
        image: php-laravel-app
        container_name: php-laravel-app
        restart: unless-stopped
        working_dir: /srv
        volumes:
            - .:/srv
            - laravel-logs:/var/log/laravel
            - laravel-storage:/srv/storage
        networks:
            - laravel-net
        depends_on:
            - db
        environment:
            - LOG_CHANNEL=stack
            - LOG_STDERR_CHANNEL=stderr
            - LOG_STORAGE=/var/log/laravel
            - APP_STORAGE=/srv/storage

    web:
        image: nginx:alpine
        container_name: laravel-web
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/srv
            - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel-net
        depends_on:
            - php

    db:
        image: mysql:8.0
        container_name: laravel-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql
        networks:
            - laravel-net

networks:
    laravel-net:
        driver: bridge

volumes:
    db-data:
    laravel-logs:
    laravel-storage:
